<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Crawler</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: #14161a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #000;
    border: 2px solid #3a4152;
    border-radius: 4px;
    /* Keeps the pixel art crisp instead of blurry when scaled */
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<canvas id="game" width="640" height="480"></canvas>

<script>
// ---------------------------------------------------------------
// Setup
// ---------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const TILE = 32; // every tile is a 32x32 square

// ---------------------------------------------------------------
// The room
// '#' is a wall, '.' is walkable floor.
// 20 tiles across, 15 tiles down = 640x480 pixels.
// ---------------------------------------------------------------
const MAP = [
  '####################',
  '#..................#',
  '#..................#',
  '#....####....####..#',
  '#.......#.......#..#',
  '#.......#.......#..#',
  '#.......#..........#',
  '#..........#####...#',
  '#..............#...#',
  '#....#####.....#...#',
  '#........#.........#',
  '#........#.........#',
  '#..................#',
  '#..................#',
  '####################',
];

const COLS = MAP[0].length;
const ROWS = MAP.length;

// Is the tile at this column/row a wall?
// Anything outside the map counts as a wall, so the player can never escape.
function isWall(col, row) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return true;
  return MAP[row][col] === '#';
}

// ---------------------------------------------------------------
// The player
// x and y are the top-left corner of the player's box, in pixels.
// ---------------------------------------------------------------
const player = {
  x: TILE * 1.25,
  y: TILE * 1.25,
  size: 20,
  speed: 160, // pixels per second
};

// ---------------------------------------------------------------
// Keyboard input
// We just record which keys are currently held down.
// ---------------------------------------------------------------
const keys = {};

window.addEventListener('keydown', (e) => {
  // Stop the arrow keys from scrolling the page
  if (e.key.startsWith('Arrow')) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

// ---------------------------------------------------------------
// Movement + wall collision
//
// The trick: move along one axis at a time. If we end up inside a
// wall, push back out of it. Doing X and Y separately is what lets
// you slide along a wall instead of getting stuck on it.
// ---------------------------------------------------------------
function moveAndCollide(dx, dy) {
  player.x += dx;
  player.y += dy;

  // Which tiles is the player's box touching right now?
  const left   = Math.floor(player.x / TILE);
  const right  = Math.floor((player.x + player.size - 1) / TILE);
  const top    = Math.floor(player.y / TILE);
  const bottom = Math.floor((player.y + player.size - 1) / TILE);

  for (let row = top; row <= bottom; row++) {
    for (let col = left; col <= right; col++) {
      if (!isWall(col, row)) continue;

      // We're overlapping a wall. Snap to its edge.
      if (dx > 0)      player.x = col * TILE - player.size;
      else if (dx < 0) player.x = (col + 1) * TILE;
      else if (dy > 0) player.y = row * TILE - player.size;
      else if (dy < 0) player.y = (row + 1) * TILE;
    }
  }
}

function update(dt) {
  let dx = 0;
  let dy = 0;

  if (keys['arrowleft']  || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup']    || keys['w']) dy -= 1;
  if (keys['arrowdown']  || keys['s']) dy += 1;

  // Without this, moving diagonally would be about 40% faster
  if (dx !== 0 && dy !== 0) {
    dx *= 0.7071;
    dy *= 0.7071;
  }

  const distance = player.speed * dt;
  if (dx !== 0) moveAndCollide(dx * distance, 0);
  if (dy !== 0) moveAndCollide(0, dy * distance);
}

// ---------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------
function draw() {
  // The room
  for (let row = 0; row < ROWS; row++) {
    for (let col = 0; col < COLS; col++) {
      ctx.fillStyle = isWall(col, row) ? '#3a4152' : '#21262e';
      ctx.fillRect(col * TILE, row * TILE, TILE, TILE);
    }
  }

  // The player
  ctx.fillStyle = '#e0c068';
  ctx.fillRect(player.x, player.y, player.size, player.size);
}

// ---------------------------------------------------------------
// The game loop: update, draw, repeat ~60 times a second
// ---------------------------------------------------------------
let lastTime = performance.now();

function frame(now) {
  // dt = seconds since the last frame. Capped so that switching
  // tabs doesn't teleport the player across the room.
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  update(dt);
  draw();

  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>

</body>
</html>
