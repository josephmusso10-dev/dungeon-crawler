<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dungeon Crawler</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #14161a;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: #000;
    user-select: none;
    cursor: crosshair;
    border: 2px solid #3a4152;
    border-radius: 4px;
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
// ===============================================================
// A first-person dungeon crawler drawn with raycasting.
//
// The whole 3D effect is one idea: for every vertical strip of the
// screen, fire a ray out into the maze and see how far it travels
// before hitting a wall. Close wall -> draw a tall strip. Far wall
// -> draw a short strip. Do that 800 times across the screen and
// your eye reads it as a corridor. This is how Wolfenstein 3D
// worked in 1992, and it is still the simplest honest 3D there is.
//
// The map underneath is exactly the same grid of characters we
// used when the game was top-down. Nothing about the maze changed.
// ===============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const VIEW_W = 800;   // width of the 3D view
const VIEW_H = 460;   // height of the 3D view
const HUD_H  = 52;    // strip along the bottom

canvas.width  = VIEW_W;
canvas.height = VIEW_H + HUD_H;

// ---------------------------------------------------------------
// The dungeon. '#' wall, '.' floor, 'E' the exit door.
// One unit = one tile. The player's position is a decimal, so
// x = 1.5 means "in the middle of column 1".
// ---------------------------------------------------------------
const MAP = [
  '#################################################################',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRRRRRRRRRRR#',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR#####...#####RRRRRRRRR..RRRRRRR#',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR#...........#RRRRRRR.........RR#',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR#.P..P..P...#RRRRR.BBB.BBB....R#',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR.............RRRR..B.....B....R#',
  '#RRRRRRRRRRRRRRRRRRRRRRRR..........P..P..P..........B.....B....R#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRR..............................R#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRR#.P..P..P...#......B.....B....R#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRR#...........#..R...B.....B...RR#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRR#####...#####.RRR..BBB.BBB..RRR#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRRRRRRRR.R.....RRR............RRR#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRRRRRRRR.RR.....R..............RR#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRRRRRRRR.RRR....................R#',
  '#RRRRRRRRRRRRRRRR.RRRRRRRRRRRRRRRRRRRRR.RRRR...................R#',
  '#RRRRRRR########...########RRRRRRRRRRRR.RRRRR....RRRR..........R#',
  '#RRRRRRR#.................#RRRRRRRRRRRR.RRRRR...RRRRRR.........R#',
  '#RRRRRRR..P..P..P..P..P....RRRRRRRRRRRR.RRRRRR..RRRRRR.........R#',
  '#...................................RRR.RRRRRRR..RRRR..........R#',
  '#R...RRR..P..P..P..P..P....BBB.BBB...RRRRRRRRRRR..RRR.........RR#',
  '#R...RRR#.................#B.....B....RRRRRRRRRR.............RRR#',
  '#RR..RRR########...########B.....B.....RRRRRRRR..............RRR#',
  '#RR..RRR.......RR.R.....................RRRRRRR........RR...RRRR#',
  '#R...RRR.......RR.R........B.....B..........RRR.............RRRR#',
  '#R....R.........R..........B.....B...........RRR............RRRR#',
  '#R.....................RRR.BBB.BBB............RR.............RRR#',
  '#.....................RRRRRR..........RR.......RR.............RR#',
  'E.....................RRRRRRRR.......RRRR......RRR.............R#',
  '#R.....BBB.BBB.........RRRRRRR......RRRRR.......R...............#',
  '#R.....B.....B.............RRR.....RRRRRR.......................#',
  '#RR....B.....B....RR..............RRRRRRR..................R....#',
  '#RRRRR............RRR............RRRR......................R....#',
  '#RRRRRRB.....B......R...........RRRR...........................R#',
  '#RRRRRRB.....B..................RRRR...........................R#',
  '#RRRRRRBBB.BBB..............RR.RRRRR...........................R#',
  '#RRRRRR.....RRR............RRRRRRRRR...........................R#',
  '#RRRRRR.....RRR...........RRRRRRRRRRR..............RRRR........R#',
  '#RRRRRR.....RRRR..RRR....RRRRRRRRRRRRRRRR..........RRRRRR......R#',
  '#RRRRRRR....RRRRRRRRRRRRRRRRRRRRRRRRRRRRR............RRRRR.....R#',
  '#RRRRRRRRR...RRRRRRRRRRRRRRRRRRRRRRRRRRRR.............RRRR.....R#',
  '#RRRRRRRRRR.....RRRRRRRRRRRRRRRRRRRRRRRRR............RRRRR.....R#',
  '#RRRRRRRRRRR...RRRRRRRRRRRRRRRRRRRRRRRRRRR..........RRRRRR....RR#',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR.....RRRRRRRRRRRRR#',
  '#RRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRRR#',
  '#################################################################',
];

// Where the ceiling lamps hang. They light the place and are most of
// what makes it feel like somewhere rather than a set of corridors.
const LAMPS = [
  [39,2],[55,3],[60,3],[44,4],[34,5],[49,6],[39,7],[54,8],
  [59,8],[42,11],[50,11],[55,13],[60,13],[46,14],[17,15],[11,16],
  [23,16],[2,18],[30,18],[54,18],[59,18],[35,19],[48,19],[14,20],
  [20,20],[9,22],[25,22],[3,23],[30,23],[38,23],[51,23],[56,23],
  [17,24],[43,24],[12,26],[34,26],[60,26],[6,27],[21,27],[46,28],
  [51,28],[16,29],[30,29],[41,29],[56,29],[25,30],[9,31],[61,31],
  [37,32],[19,33],[44,33],[49,33],[54,34],[24,35],[7,36],[40,36],
  [59,36],[45,38],[50,38],[11,39],[59,41],
];

const COLS = MAP[0].length;
const ROWS = MAP.length;

const START_COL = 39, START_ROW = 7;
// Eight. A ninth tips the cavern from a hard fight into a
// guaranteed death -- measured at 12/12 escapes with eight, 0/12 with nine.
const ENEMY_SPAWNS = [[15, 40], [7, 37], [4, 21], [17, 7], [9, 16], [9, 25], [14, 20], [16, 32]];
// The three keys, in the order you must collect them. Each one lives in
// a named part of the dungeon; the objective tracker tells you which is
// next and roughly which way it lies. Nothing is marked on the map.
// Ordered so most of the journey happens while they are still slow, and
// the run to the door at the end is short. Legs: 34, 13, 27, 11 steps.
// Ordered so the long walking happens while the guards are still slow,
// and the dangerous end of the run is short. Legs: 16, 54, 29, 13 steps.
const KEYS = [
  { tile: [55,  7], name: 'Bone Key', place: 'the Ossuary' },
  { tile: [30, 22], name: 'Iron Key', place: 'the Hollow' },
  { tile: [10, 31], name: 'Ember Key', place: 'the Deep Vault' },
];
const KEY_TILES = KEYS.map(k => k.tile);
const KEYS_NEEDED  = KEY_TILES.length;

function tileAt(col, row) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return '#';
  return MAP[row][col];
}
// The exit door counts as a wall: it blocks you and it gets drawn
// like a wall, just in its own colour.
function isWall(col, row) {
  const t = tileAt(col, row);
  return t !== '.';
}
// The dungeon is a cavern with things built into it. Each kind of wall
// gets its own surface: rough rock, cut stone, carved pillars, and the
// shrine stonework the keys sit inside.
function isShrine(col, row) { return tileAt(col, row) === 'B'; }
function isRock(col, row)   { return tileAt(col, row) === 'R'; }
function isPillar(col, row) { return tileAt(col, row) === 'P'; }
function isDoor(col, row) { return tileAt(col, row) === 'E'; }

let doorCol = 0, doorRow = 0;
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (isDoor(c, r)) { doorCol = c; doorRow = r; }

// ---------------------------------------------------------------
// Player, enemies, keys
// ---------------------------------------------------------------
const MAX_HEALTH  = 4;
const INVULN_TIME = 1.2;

// Every key you take wakes the dungeon up another notch. The last
// stage is deliberately faster than you are -- once they see you at
// that point you cannot outrun them, you have to break line of sight.
const ENEMY_TIERS = [
  { speed: 1.4, you: 3.0, damage: 1, sight:  5, label: 'PROWLING', colour: [138, 74, 62] },
  { speed: 2.2, you: 3.3, damage: 1, sight:  7, label: 'HUNTING',  colour: [176, 74, 66] },
  { speed: 3.0, you: 3.6, damage: 2, sight:  9, label: 'ENRAGED',  colour: [214, 72, 62] },
  { speed: 4.2, you: 3.9, damage: 3, sight: 10, label: 'FRENZIED', colour: [255, 104, 56] },
];
function tier() { return ENEMY_TIERS[Math.min(player.keys, ENEMY_TIERS.length - 1)]; }
let ALERT_MEMORY  = 2.0;    // seconds it keeps hunting after losing sight of you
let KEY_RECOIL    = 1.6;    // seconds they stagger when the dungeon escalates
let DANGER_RANGE  = 9.0;    // how close a guard has to be before the screen bleeds
let PATROL_PACE   = 0.55;   // how briskly they walk a beat, as a share of chase speed    // seconds they stagger when the dungeon escalates
const RADIUS      = 0.22;   // how fat you are, for bumping into walls

const player = { x: 0, y: 0, angle: 0, health: MAX_HEALTH, invuln: 0, keys: 0 };

let enemies = [];
let keys3d  = [];
let gameState = 'playing';    // 'playing' | 'won' | 'dead'
let message = '';             // transient text, e.g. the locked-door hint
let messageTimer = 0;
let showMap = true;

// Where the horizon sits. A raycaster cannot really tilt the camera, so
// looking up and down slides the whole horizon instead. Your eye reads
// that as tilting your head, and it costs one number.
let horizon = 0;
const HORIZON_LIMIT = VIEW_H * 0.38;

function resetGame() {
  player.x = START_COL + 0.5;
  player.y = START_ROW + 0.5;
  player.angle = 0;           // facing east, into the dungeon
  horizon = 0;
  appliedYaw = 0;
  pitchOffset = 0;
  clutch = false;
  player.health = MAX_HEALTH;
  player.invuln = 0;
  player.keys = 0;

  enemies = ENEMY_SPAWNS.map(([c, r]) => ({
    x: c + 0.5, y: r + 0.5,
    alert: 0,          // seconds left of actively hunting you
    stun: 0,           // seconds left staggering after a key is taken
    patrol: 0,         // which of the guarded places it is walking to
    wanderX: c + 0.5,  // unused while patrolling, kept for the stagger
    wanderY: r + 0.5,
  }));
  enemies.forEach((e, i) => {
    e.patrol = PATROL_FIELDS.length
      ? Math.floor(i * PATROL_FIELDS.length / enemies.length) % PATROL_FIELDS.length
      : 0;
  });
  keys3d  = KEYS.map((k) => ({ x: k.tile[0] + 0.5, y: k.tile[1] + 0.5, taken: false }));

  flowField = null;
  repathTimer = 0;
  message = '';
  messageTimer = 0;
  gameState = 'playing';
}

// ---------------------------------------------------------------
// Keyboard
// ---------------------------------------------------------------
const held = {};
window.addEventListener('keydown', (e) => {
  if (e.key.startsWith('Arrow')) e.preventDefault();
  const k = e.key.toLowerCase();
  held[k] = true;
  if (k === 'r' && gameState !== 'playing') resetGame();
  if (k === 'm') showMap = !showMap;
});
window.addEventListener('keyup', (e) => { held[e.key.toLowerCase()] = false; });

// Looking around follows the cursor while it is over the view. No
// clicking, no dragging.
//
// Sideways is a STEERING RATE, not a direct mapping: the further the
// cursor sits from the middle, the faster you swing round. That is what
// lets you turn a full circle even though a real cursor stops dead at
// the edge of the window. Up and down is mapped directly, so the cursor
// height is where you are looking, and centring it levels you out.
let pointerInView = false;
let pointerNX = 0, pointerNY = 0;   // -1 .. 1 across the 3D view
let clutch = false;                 // button held: the view ignores the cursor

// The cursor turns you, and it does it one way only: where the cursor
// sits IS which way you face. Sweeping the cursor from one side of the
// view to the other takes you the whole way round, 360 degrees, so every
// direction is reachable without the view ever drifting on its own.
//
// Left edge is half a turn one way, right edge is half a turn the other,
// middle is straight ahead. Hold the cursor still and you stay still.
let LOOK_YAW = Math.PI;         // half a turn at each edge -> a full turn across
let PITCH_GAIN = 1.5;           // vertical sensitivity

// How much of the cursor's swing is currently folded into the view.
// Kept separate so we can take it back out cleanly when the cursor moves
// or leaves, which is what makes this an aim rather than a drift.
let appliedYaw = 0;
let pitchOffset = 0;    // where 'level' currently sits, moved by the clutch

// What the cursor's height alone is asking for
function cursorPitch() {
  return -Math.max(-1, Math.min(1, pointerNY * PITCH_GAIN)) * HORIZON_LIMIT;
}

// Called when you let go of the button: keep the view exactly where it is,
// but treat wherever the cursor now sits as the new neutral.
function rebaseToCursor() {
  appliedYaw = Math.max(-1, Math.min(1, pointerNX)) * LOOK_YAW;
  pitchOffset = horizon - cursorPitch();
}

function trackPointer(e) {
  const rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return;
  const viewH = rect.height * (VIEW_H / canvas.height);   // the 3D part, above the HUD
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  pointerNX = (x / rect.width) * 2 - 1;
  pointerNY = (y / viewH) * 2 - 1;
  pointerInView = x >= 0 && x <= rect.width && y >= 0 && y <= viewH;
}

canvas.addEventListener('mousemove', trackPointer);
canvas.addEventListener('mouseenter', trackPointer);
canvas.addEventListener('mouseleave', () => { pointerInView = false; });

// The view points where the cursor points. Cursor in the middle means
// straight ahead; move it and the view swings to match; bring it back
// and the view comes back with it. Nothing drifts on its own.
function lookWithCursor() {
  if (clutch) return;                // button held: the view stays put

  if (!pointerInView) {
    player.angle -= appliedYaw;      // hand the swing back
    appliedYaw = 0;
    return;
  }

  // Straight mapping: cursor position is the direction you face. Nothing
  // accumulates, so holding the cursor still holds the view still.
  const aim = Math.max(-1, Math.min(1, pointerNX)) * LOOK_YAW;
  player.angle += aim - appliedYaw;  // only ever apply the difference
  appliedYaw = aim;

  horizon = Math.max(-HORIZON_LIMIT, Math.min(HORIZON_LIMIT, pitchOffset + cursorPitch()));
}

// Hold the button to unhook the view from the cursor. Move the cursor
// wherever you like, let go, and the view carries on from where it was.
// It is the same thing as lifting a mouse off the desk and putting it
// back in the middle, and it is why the cursor never runs out of room.
canvas.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  e.preventDefault();
  clutch = true;
});
window.addEventListener('mouseup', (e) => {
  if (e.button !== 0 || !clutch) return;
  clutch = false;
  rebaseToCursor();     // adopt the cursor's new spot without the view jumping
});

// ---------------------------------------------------------------
// Moving without walking through walls
//
// Same trick as the top-down version: try each axis separately, so
// brushing a wall slides you along it instead of stopping you dead.
// ---------------------------------------------------------------
function blocked(x, y) {
  return isWall(Math.floor(x - RADIUS), Math.floor(y - RADIUS)) ||
         isWall(Math.floor(x + RADIUS), Math.floor(y - RADIUS)) ||
         isWall(Math.floor(x - RADIUS), Math.floor(y + RADIUS)) ||
         isWall(Math.floor(x + RADIUS), Math.floor(y + RADIUS));
}
function moveBody(body, dx, dy) {
  if (!blocked(body.x + dx, body.y)) body.x += dx;
  if (!blocked(body.x, body.y + dy)) body.y += dy;
}

// ---------------------------------------------------------------
// Enemy pathfinding (unchanged from the top-down version)
//
// Flood outward from the player tile by tile, recording for each
// tile which neighbour is one step closer. Enemies walk downhill
// on that. One flood serves every enemy.
// ---------------------------------------------------------------
const DIRECTIONS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const REPATH_INTERVAL = 0.25;
let flowField = null;
let repathTimer = 0;

function buildFlowField(startCol, startRow) {
  const next = new Int32Array(COLS * ROWS).fill(-1);
  const seen = new Uint8Array(COLS * ROWS);
  const start = startRow * COLS + startCol;
  const queue = [start];
  seen[start] = 1;

  for (let head = 0; head < queue.length; head++) {
    const here = queue[head];
    const col = here % COLS, row = (here / COLS) | 0;
    for (const [dc, dr] of DIRECTIONS) {
      const nc = col + dc, nr = row + dr;
      if (isWall(nc, nr)) continue;
      const there = nr * COLS + nc;
      if (seen[there]) continue;
      seen[there] = 1;
      next[there] = here;
      queue.push(there);
    }
  }
  return next;
}

// Can this thing actually see you, or is there a wall in the way?
// We walk in small steps from it to you and stop if we hit anything.
// Same idea as the rays we draw the walls with, just one ray.
function canSee(fromX, fromY, toX, toY) {
  const dx = toX - fromX, dy = toY - fromY;
  const dist = Math.hypot(dx, dy);
  if (dist > tier().sight) return false;
  const stepCount = Math.ceil(dist / 0.1);
  for (let i = 1; i < stepCount; i++) {
    const t = i / stepCount;
    if (isWall(Math.floor(fromX + dx * t), Math.floor(fromY + dy * t))) return false;
  }
  return true;
}

// ---------------------------------------------------------------
// Patrol routes
//
// Left to wander at random, guards drift into corners of a cavern this
// size and you can walk the whole place without meeting one. So instead
// they patrol between the things worth guarding -- the three shrines and
// the way out -- which puts them on the routes you actually need.
//
// These paths lead to fixed places, not to you, so a guard still has no
// idea where you are until it sees you.
// ---------------------------------------------------------------
const PATROL_FIELDS = [];

function buildPatrolFields() {
  PATROL_FIELDS.length = 0;
  const posts = [];

  // the things actually worth guarding
  for (const k of KEYS) posts.push(k.tile);
  const side = DIRECTIONS
    .map(([dc, dr]) => [doorCol + dc, doorRow + dr])
    .find(([c, r]) => !isWall(c, r));
  if (side) posts.push(side);

  // Plus a spread of waypoints across the rest of the cavern. Without
  // these, every guard walks the same four places and they pile up on
  // top of each other -- and four guards in one spot is not a fight,
  // it is just death.
  // Chosen by a fixed sweep of the map, not at random: random waypoints
  // meant every page load produced a different game, and a difficulty
  // that moves on its own cannot be measured or tuned.
  for (let spacing = 18; spacing >= 10 && posts.length < 12; spacing -= 2) {
    for (let r = 2; r < ROWS - 2 && posts.length < 12; r++) {
      for (let c = 2; c < COLS - 2 && posts.length < 12; c++) {
        if (isWall(c, r)) continue;
        let open = 0;
        for (const [dc, dr] of DIRECTIONS) if (!isWall(c + dc, r + dr)) open++;
        if (open < 3) continue;                    // not a poky corner
        let far = true;
        for (const [pc, pr] of posts) {
          if (Math.abs(pc - c) + Math.abs(pr - r) < spacing) { far = false; break; }
        }
        if (far) posts.push([c, r]);
      }
    }
  }

  for (const t of posts) PATROL_FIELDS.push({ tile: t, field: buildFlowField(t[0], t[1]) });
}

// Somewhere new to amble to while it has not spotted you
function pickWanderSpot(enemy) {
  const col = Math.floor(enemy.x), row = Math.floor(enemy.y);
  const open = DIRECTIONS
    .map(([dc, dr]) => [col + dc, row + dr])
    .filter(([c, r]) => !isWall(c, r));
  if (!open.length) return;

  // Purely random. It must NOT use flowField here -- that is a path
  // straight to the player, so biasing toward it would let an enemy
  // that cannot see you still track you through solid walls.
  const [c, r] = open[(Math.random() * open.length) | 0];
  enemy.wanderX = c + 0.5;
  enemy.wanderY = r + 0.5;
}

function updateEnemy(enemy, dt) {
  // Still reeling from the last key: it cannot move or look for you
  if (enemy.stun > 0) { enemy.stun -= dt; return; }

  // Spot you, and remember you for a few seconds after you break away
  if (canSee(enemy.x, enemy.y, player.x, player.y)) enemy.alert = ALERT_MEMORY;
  else if (enemy.alert > 0) enemy.alert -= dt;

  let targetX, targetY, speed;

  if (enemy.alert > 0) {
    // Hunting: follow the flow field straight to you
    const col = Math.floor(enemy.x), row = Math.floor(enemy.y);
    const step = flowField ? flowField[row * COLS + col] : -1;
    if (step === -1) { targetX = player.x; targetY = player.y; }
    else {
      targetX = (step % COLS) + 0.5;
      targetY = ((step / COLS) | 0) + 0.5;
    }
    speed = tier().speed;
  } else if (PATROL_FIELDS.length) {
    // Patrolling: walking a beat between the places worth guarding
    const post = PATROL_FIELDS[enemy.patrol % PATROL_FIELDS.length];
    const here = Math.hypot(post.tile[0] + 0.5 - enemy.x, post.tile[1] + 0.5 - enemy.y);
    if (here < 1.5) {
      // arrived: pick a different post to walk to
      let next = enemy.patrol;
      if (PATROL_FIELDS.length > 1) {
        while (next === enemy.patrol) next = (Math.random() * PATROL_FIELDS.length) | 0;
      }
      enemy.patrol = next;
    }
    const col = Math.floor(enemy.x), row = Math.floor(enemy.y);
    const step = post.field[row * COLS + col];
    if (step === -1) { targetX = post.tile[0] + 0.5; targetY = post.tile[1] + 0.5; }
    else {
      targetX = (step % COLS) + 0.5;
      targetY = ((step / COLS) | 0) + 0.5;
    }
    speed = tier().speed * PATROL_PACE;
  } else {
    // no posts to walk (should not happen): shuffle about instead
    if (Math.hypot(enemy.wanderX - enemy.x, enemy.wanderY - enemy.y) < 0.1) pickWanderSpot(enemy);
    targetX = enemy.wanderX;
    targetY = enemy.wanderY;
    speed = tier().speed * 0.45;
  }

  const dx = targetX - enemy.x, dy = targetY - enemy.y;
  const length = Math.hypot(dx, dy);
  if (length < 0.001) return;
  const distance = Math.min(speed * dt, length);
  moveBody(enemy, (dx / length) * distance, (dy / length) * distance);
}

// ---------------------------------------------------------------
// One step of the game
// ---------------------------------------------------------------
function update(dt) {
  if (messageTimer > 0) { messageTimer -= dt; if (messageTimer <= 0) message = ''; }
  if (gameState !== 'playing') return;

  lookWithCursor();
  // --- walking and stepping sideways ---
  // W/S go the way you are facing. A/D step left and right without
  // changing which way you face -- the cursor does all the turning.
  let forward = 0, sideways = 0;
  if (held['w'] || held['arrowup'])    forward  += 1;
  if (held['s'] || held['arrowdown'])  forward  -= 1;
  if (held['d'] || held['arrowright']) sideways += 1;
  if (held['a'] || held['arrowleft'])  sideways -= 1;

  if (forward !== 0 || sideways !== 0) {
    // going forwards and sideways at once should not be faster
    const len = Math.hypot(forward, sideways);
    forward /= len; sideways /= len;

    const facingX = Math.cos(player.angle), facingY = Math.sin(player.angle);
    const rightX = -facingY, rightY = facingX;   // your right hand, 90 degrees round

    const step = tier().you * dt;
    moveBody(player,
      (facingX * forward + rightX * sideways) * step,
      (facingY * forward + rightY * sideways) * step);
  }

  // --- picking up the key you are currently after ---
  // Only the active one counts, so the order is fixed.
  const active = keys3d[player.keys];
  if (active && !active.taken) {
    const k = active;
    if (Math.hypot(k.x - player.x, k.y - player.y) < 0.5) {
      k.taken = true;
      player.keys += 1;
      // Everything in here gets faster the moment you take a key. Without
      // this stagger, anything already near you at that instant simply
      // kills you, because the new speed is quicker than you can run.
      for (const e of enemies) { e.stun = KEY_RECOIL; e.alert = 0; }
      message = player.keys < KEYS_NEEDED
        ? KEYS[player.keys - 1].name + ' taken  -  they stagger, then come back ' + tier().label
        : KEYS[KEYS_NEEDED - 1].name + ' taken. They are FRENZIED. RUN for the door.';
      messageTimer = 3;
    }
  }

  // --- the door ---
  const toDoor = Math.hypot((doorCol + 0.5) - player.x, (doorRow + 0.5) - player.y);
  if (toDoor < 1.2) {
    if (player.keys >= KEYS_NEEDED) { gameState = 'won'; return; }
    if (messageTimer <= 0) {
      message = 'Locked. You still need the ' + KEYS[player.keys].name + '.';
      messageTimer = 1.5;
    }
  }

  // --- enemies ---
  repathTimer -= dt;
  if (repathTimer <= 0) {
    flowField = buildFlowField(Math.floor(player.x), Math.floor(player.y));
    repathTimer = REPATH_INTERVAL;
  }
  for (const e of enemies) updateEnemy(e, dt);

  // --- getting hit ---
  if (player.invuln > 0) player.invuln -= dt;
  if (player.invuln <= 0) {
    for (const e of enemies) {
      if (Math.hypot(e.x - player.x, e.y - player.y) > 0.45) continue;
      player.health -= tier().damage;
      player.invuln = INVULN_TIME;
      if (player.health <= 0) { player.health = 0; gameState = 'dead'; }
      break;   // one hit per contact, however many pile on
    }
  }
}

// ===============================================================
// Drawing
// ===============================================================
const zBuffer = new Float64Array(VIEW_W);   // wall distance per screen column

function shade(r, g, b, f) {
  return 'rgb(' + (r*f|0) + ',' + (g*f|0) + ',' + (b*f|0) + ')';
}
// Things far away fade into the dark. This is most of what sells depth.
function fog(dist) {
  return Math.max(0.15, Math.min(1, 1.35 - dist / 11));
}

// ===============================================================
// Wall surfaces and lamplight
// ===============================================================

// Rather than ship image files, we paint two small textures once at
// startup onto off-screen canvases and then slice one-pixel-wide columns
// out of them. That is the same trick the old raycasters used, and it
// keeps everything in this one file.
const TEX_SIZE = 64;

function makeTexture(paint) {
  const c = document.createElement('canvas');
  c.width = TEX_SIZE; c.height = TEX_SIZE;
  paint(c.getContext('2d'));
  return c;
}

// Ordinary dungeon stone: courses of blocks with mortar between them,
// plus some grime so it is not flat.
const WALL_TEX = makeTexture((g) => {
  g.fillStyle = '#5c5346';
  g.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
  const courses = 4, blockH = TEX_SIZE / courses;
  for (let row = 0; row < courses; row++) {
    const offset = (row % 2) ? blockH : 0;      // stagger every other course
    for (let x = -blockH; x < TEX_SIZE; x += blockH * 2) {
      g.fillStyle = 'rgba(0,0,0,0.16)';
      g.fillRect(x + offset, row * blockH, 1.5, blockH);       // vertical joint
    }
    g.fillStyle = 'rgba(0,0,0,0.22)';
    g.fillRect(0, row * blockH, TEX_SIZE, 1.5);                // horizontal joint
    g.fillStyle = 'rgba(255,255,255,0.05)';
    g.fillRect(0, row * blockH + 2, TEX_SIZE, 1);              // highlight under it
  }
  for (let i = 0; i < 260; i++) {                              // grime
    const x = Math.random() * TEX_SIZE, y = Math.random() * TEX_SIZE;
    g.fillStyle = 'rgba(0,0,0,' + (0.03 + Math.random() * 0.07).toFixed(3) + ')';
    g.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
});

// The shrine buildings: darker stone, carved with a crude eye motif so
// you can tell at a glance that a building is not just more corridor.
const SHRINE_TEX = makeTexture((g) => {
  g.fillStyle = '#3d2b34';
  g.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
  for (let row = 0; row < 8; row++) {
    g.fillStyle = 'rgba(0,0,0,0.28)';
    g.fillRect(0, row * 8, TEX_SIZE, 1);
  }
  // carved ring with a slit pupil, centred
  g.strokeStyle = 'rgba(226,170,120,0.55)';
  g.lineWidth = 2;
  g.beginPath(); g.arc(32, 32, 13, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(32, 32, 19, 0, Math.PI * 2); g.stroke();
  g.fillStyle = 'rgba(20,10,14,0.85)';
  g.beginPath(); g.ellipse(32, 32, 4, 10, 0, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 200; i++) {
    const x = Math.random() * TEX_SIZE, y = Math.random() * TEX_SIZE;
    g.fillStyle = 'rgba(0,0,0,' + (0.04 + Math.random() * 0.09).toFixed(3) + ')';
    g.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
  }
});

// Raw cavern rock: no courses, no joints, just uneven stone and cracks.
const ROCK_TEX = makeTexture((g) => {
  g.fillStyle = '#4f4a46';
  g.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
  // broad uneven blotches
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * TEX_SIZE, y = Math.random() * TEX_SIZE;
    const w = 6 + Math.random() * 16, h = 5 + Math.random() * 14;
    g.fillStyle = Math.random() < 0.5
      ? 'rgba(255,255,255,' + (0.02 + Math.random() * 0.05).toFixed(3) + ')'
      : 'rgba(0,0,0,' + (0.03 + Math.random() * 0.07).toFixed(3) + ')';
    g.beginPath(); g.ellipse(x, y, w / 2, h / 2, Math.random() * 3, 0, Math.PI * 2); g.fill();
  }
  // cracks running down the face
  g.strokeStyle = 'rgba(0,0,0,0.30)';
  for (let i = 0; i < 7; i++) {
    g.lineWidth = 0.6 + Math.random();
    let x = Math.random() * TEX_SIZE, y = 0;
    g.beginPath(); g.moveTo(x, y);
    while (y < TEX_SIZE) { y += 4 + Math.random() * 7; x += (Math.random() - 0.5) * 9; g.lineTo(x, y); }
    g.stroke();
  }
  for (let i = 0; i < 300; i++) {
    g.fillStyle = 'rgba(0,0,0,' + (0.03 + Math.random() * 0.08).toFixed(3) + ')';
    g.fillRect(Math.random() * TEX_SIZE, Math.random() * TEX_SIZE, 1, 1 + Math.random());
  }
});

// A carved column: fluting down the shaft, a band top and bottom.
const PILLAR_TEX = makeTexture((g) => {
  g.fillStyle = '#7a6e5c';
  g.fillRect(0, 0, TEX_SIZE, TEX_SIZE);
  for (let x = 2; x < TEX_SIZE; x += 7) {          // flutes
    g.fillStyle = 'rgba(0,0,0,0.20)';
    g.fillRect(x, 0, 2, TEX_SIZE);
    g.fillStyle = 'rgba(255,255,255,0.07)';
    g.fillRect(x + 2, 0, 2, TEX_SIZE);
  }
  for (const y of [0, 6, TEX_SIZE - 8, TEX_SIZE - 2]) {   // capital and base
    g.fillStyle = 'rgba(0,0,0,0.32)';
    g.fillRect(0, y, TEX_SIZE, 2);
  }
  g.fillStyle = 'rgba(255,255,255,0.06)';
  g.fillRect(0, 8, TEX_SIZE, 2);
  g.fillRect(0, TEX_SIZE - 12, TEX_SIZE, 2);
});

// ---------------------------------------------------------------
// Lamplight
//
// Worked out once at startup: how brightly each floor tile is lit by the
// lamps hanging over it. Walls then borrow the light of the tile you are
// standing in when you look at them, which costs nothing per frame and
// gives pools of light with dark stretches between.
// ---------------------------------------------------------------
const lightMap = new Float32Array(COLS * ROWS);
(function buildLightMap() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let lit = 0;
      for (const [lc, lr] of LAMPS) {
        const d = Math.hypot(lc - c, lr - r);
        if (d < 7.5) lit += (1 - d / 7.5) * (1 - d / 7.5);
      }
      lightMap[r * COLS + c] = Math.min(1, lit);
    }
  }
})();
function lightAt(col, row) {
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return 0;
  return lightMap[row * COLS + col];
}

function castWalls() {
  // Direction the player faces, plus a "camera plane" at right angles
  // to it. Sweeping across that plane is what gives us a field of view.
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;   // 0.66 -> about a 66 degree view

  for (let x = 0; x < VIEW_W; x++) {
    // -1 at the left edge of the screen, +1 at the right edge
    const cameraX = 2 * x / VIEW_W - 1;
    const rayX = dirX + planeX * cameraX;
    const rayY = dirY + planeY * cameraX;

    let mapX = Math.floor(player.x), mapY = Math.floor(player.y);

    // How far along the ray you travel to cross one full tile
    const deltaX = Math.abs(1 / rayX), deltaY = Math.abs(1 / rayY);

    let stepX, stepY, sideX, sideY;
    if (rayX < 0) { stepX = -1; sideX = (player.x - mapX) * deltaX; }
    else          { stepX =  1; sideX = (mapX + 1 - player.x) * deltaX; }
    if (rayY < 0) { stepY = -1; sideY = (player.y - mapY) * deltaY; }
    else          { stepY =  1; sideY = (mapY + 1 - player.y) * deltaY; }

    // Walk the ray tile by tile until it hits something
    let side = 0, guard = 0;
    while (guard++ < 128) {
      if (sideX < sideY) { sideX += deltaX; mapX += stepX; side = 0; }
      else               { sideY += deltaY; mapY += stepY; side = 1; }
      if (isWall(mapX, mapY)) break;
    }

    // Distance measured straight ahead, not along the ray. Using the
    // ray length instead would bow the walls outward (fisheye).
    const dist = side === 0 ? (sideX - deltaX) : (sideY - deltaY);
    zBuffer[x] = dist;

    const height = Math.min(VIEW_H * 4, VIEW_H / dist);
    const top = (VIEW_H - height) / 2 + horizon;

    // Where along the wall did the ray land? That picks the column of
    // the texture we slice out.
    let wallX = (side === 0) ? player.y + dist * rayY : player.x + dist * rayX;
    wallX -= Math.floor(wallX);
    let texX = Math.floor(wallX * TEX_SIZE);
    if (texX < 0) texX = 0; else if (texX >= TEX_SIZE) texX = TEX_SIZE - 1;

    // Brightness: distance haze, the darker face of a corner, and how
    // much lamplight reaches the floor tile in front of this wall.
    const lit = lightAt(mapX - stepX, mapY - stepY);
    let f = fog(dist) * (side === 1 ? 0.72 : 1) * (0.30 + 0.70 * lit);

    if (isDoor(mapX, mapY)) {
      // The way out: red while locked, green once you have every key
      if (player.keys >= KEYS_NEEDED) ctx.fillStyle = shade(76, 200, 90, Math.min(1, f * 1.6));
      else                            ctx.fillStyle = shade(190, 60, 70, Math.min(1, f * 1.6));
      ctx.fillRect(x, top, 1, height);
    } else {
      const surface = isShrine(mapX, mapY) ? SHRINE_TEX
                    : isRock(mapX, mapY)   ? ROCK_TEX
                    : isPillar(mapX, mapY) ? PILLAR_TEX
                    :                        WALL_TEX;
      ctx.drawImage(surface, texX, 0, 1, TEX_SIZE, x, top, 1, height);
      // shade the slice by drawing darkness over it
      const dark = 1 - Math.max(0, Math.min(1, f));
      if (dark > 0.01) {
        ctx.fillStyle = 'rgba(6,4,4,' + dark.toFixed(3) + ')';
        ctx.fillRect(x, top, 1, height);
      }
    }
  }
}

// Draw a flat coloured square out in the world (a key or an enemy),
// hiding whatever parts of it are behind a wall.
function drawSprite(wx, wy, r, g, b, scale, drop) {
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;

  const sx = wx - player.x, sy = wy - player.y;
  const invDet = 1 / (planeX * dirY - dirX * planeY);
  const tx = invDet * (dirY * sx - dirX * sy);       // sideways offset
  const ty = invDet * (-planeY * sx + planeX * sy);  // depth into the screen
  if (ty <= 0.08) return;                            // behind us

  const screenX = (VIEW_W / 2) * (1 + tx / ty);
  const size = (VIEW_H / ty) * scale;
  const centreY = VIEW_H / 2 + horizon + (VIEW_H / ty) * drop;
  const top = centreY - size / 2;
  const left = screenX - size / 2;

  const f = fog(ty);
  ctx.fillStyle = shade(r, g, b, f);
  const from = Math.max(0, Math.floor(left));
  const to   = Math.min(VIEW_W, Math.ceil(left + size));
  for (let x = from; x < to; x++) {
    if (ty >= zBuffer[x]) continue;    // a wall is in front of this column
    ctx.fillRect(x, top, 1, size);
  }
}

// ---------------------------------------------------------------
// What the dungeon's inhabitants look like.
//
// Drawn from this little picture rather than as a flat block. Each
// letter is a colour: o skin, E eye, n neck, t tunic, a arm,
// l leg, b boot. A dot means "see through here".
//
// To draw one we squash this picture onto the screen at whatever
// size its distance calls for -- the same way the wall strips work.
// ---------------------------------------------------------------
const PERSON = [
  '....ooo....',
  '...ooooo...',
  '...oEoEo...',
  '...ooooo...',
  '....nnn....',
  '..ttttttt..',
  '.attttttta.',
  '.attttttta.',
  '.attttttta.',
  '..ttttttt..',
  '..ttt.ttt..',
  '..ll...ll..',
  '..ll...ll..',
  '..ll...ll..',
  '..bb...bb..',
  '..bb...bb..',
];
const PERSON_W = PERSON[0].length;
const PERSON_H = PERSON.length;

// Squeeze each column of that picture into runs of the same colour,
// once, at startup. Drawing then costs a handful of rectangles per
// screen column instead of one per pixel.
const PERSON_RUNS = (() => {
  const cols = [];
  for (let x = 0; x < PERSON_W; x++) {
    const runs = [];
    let y = 0;
    while (y < PERSON_H) {
      const ch = PERSON[y][x];
      let end = y;
      while (end + 1 < PERSON_H && PERSON[end + 1][x] === ch) end++;
      if (ch !== '.') runs.push({ from: y, to: end + 1, ch });
      y = end + 1;
    }
    cols.push(runs);
  }
  return cols;
})();

function personColour(ch, tint, f, awake) {
  const dim = awake ? 1 : 0.55;      // asleep to your presence = duller
  switch (ch) {
    case 'o': return shade(214, 178, 140, f * dim);
    case 'E': return shade(26, 18, 22, f * dim);
    case 'n': return shade(178, 144, 112, f * dim);
    case 't': return shade(tint[0], tint[1], tint[2], f * dim);
    case 'a': return shade(tint[0] * 0.72, tint[1] * 0.72, tint[2] * 0.72, f * dim);
    case 'l': return shade(62, 52, 58, f * dim);
    default:  return shade(36, 30, 34, f * dim);
  }
}

// Draw one of them standing in the world, hidden wherever a wall is
// in front. Same projection maths as drawSprite, but instead of one
// solid rectangle we paint the little picture above.
function drawPerson(wx, wy, tint, awake) {
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;

  const sx = wx - player.x, sy = wy - player.y;
  const invDet = 1 / (planeX * dirY - dirX * planeY);
  const tx = invDet * (dirY * sx - dirX * sy);
  const ty = invDet * (-planeY * sx + planeX * sy);
  if (ty <= 0.15) return;

  const screenX = (VIEW_W / 2) * (1 + tx / ty);
  const height = Math.min(VIEW_H * 3, (VIEW_H / ty) * 0.82);
  const width = height * (PERSON_W / PERSON_H);
  const left = screenX - width / 2;
  const top = VIEW_H / 2 + horizon + (VIEW_H / ty) * 0.09 - height;   // feet on the floor line

  const f = fog(ty);
  const from = Math.max(0, Math.floor(left));
  const to = Math.min(VIEW_W, Math.ceil(left + width));

  for (let x = from; x < to; x++) {
    if (ty >= zBuffer[x]) continue;          // a wall is nearer than they are
    let col = Math.floor(((x - left) / width) * PERSON_W);
    if (col < 0) col = 0; else if (col >= PERSON_W) col = PERSON_W - 1;
    for (const run of PERSON_RUNS[col]) {
      const y0 = top + (run.from / PERSON_H) * height;
      const y1 = top + (run.to / PERSON_H) * height;
      ctx.fillStyle = personColour(run.ch, tint, f, awake);
      ctx.fillRect(x, y0, 1, Math.max(1, y1 - y0));
    }
  }
}

// A lamp on a short chain, hung above head height. Same projection as
// everything else, just placed high instead of on the floor.
function drawLamp(wx, wy) {
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;
  const sx = wx - player.x, sy = wy - player.y;
  const invDet = 1 / (planeX * dirY - dirX * planeY);
  const tx = invDet * (dirY * sx - dirX * sy);
  const ty = invDet * (-planeY * sx + planeX * sy);
  if (ty <= 0.25 || ty > 17) return;

  const screenX = (VIEW_W / 2) * (1 + tx / ty);
  const unit = VIEW_H / ty;                 // one world unit, in pixels, at this depth
  const bulbY = VIEW_H / 2 + horizon - unit * 0.40;
  const bulbR = Math.max(1.5, unit * 0.055);
  const col = Math.round(screenX);
  if (col < 0 || col >= VIEW_W || ty >= zBuffer[col]) return;   // behind a wall

  const f = fog(ty);

  // chain up into the dark
  ctx.fillStyle = shade(58, 50, 44, f);
  ctx.fillRect(screenX - Math.max(0.5, unit * 0.008), bulbY - unit * 0.16,
               Math.max(1, unit * 0.016), unit * 0.16);

  // halo, then the bulb itself
  ctx.globalAlpha = Math.min(0.22, 0.22 * f);
  ctx.fillStyle = 'rgb(206,140,64)';
  ctx.beginPath(); ctx.arc(screenX, bulbY, bulbR * 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = Math.min(0.45, 0.45 * f);
  ctx.beginPath(); ctx.arc(screenX, bulbY, bulbR * 3.4, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = Math.min(0.8, 0.8 * f);
  ctx.beginPath(); ctx.arc(screenX, bulbY, bulbR * 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgb(255,226,170)';
  ctx.beginPath(); ctx.arc(screenX, bulbY, bulbR, 0, Math.PI * 2); ctx.fill();
}

function drawLamps() {
  // furthest first so nearer lamps paint over them
  const near = [];
  for (const [c, r] of LAMPS) {
    const d = Math.hypot(c + 0.5 - player.x, r + 0.5 - player.y);
    if (d < 17) near.push({ x: c + 0.5, y: r + 0.5, d });
  }
  near.sort((a, b) => b.d - a.d);
  for (const l of near) drawLamp(l.x, l.y);
}

// What each guard is doing right now, named. Three states:
// staggered by a key, hunting you, or walking its beat.
function guardMode(e) {
  if (e.stun > 0)  return { name: 'STAGGERED',  colour: 'rgb(150,160,180)' };
  if (e.alert > 0) return { name: 'HUNTING',    colour: 'rgb(255,110,80)'  };
  return             { name: 'PATROLLING', colour: 'rgb(198,184,158)' };
}

// Float that word above each guard you can actually see. Uses the same
// projection as the figures, and the same z-buffer test, so a label never
// shows through a wall its owner is hidden behind.
function drawGuardLabels() {
  const dirX = Math.cos(player.angle), dirY = Math.sin(player.angle);
  const planeX = -dirY * 0.66, planeY = dirX * 0.66;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  for (const e of enemies) {
    const sx = e.x - player.x, sy = e.y - player.y;
    const invDet = 1 / (planeX * dirY - dirX * planeY);
    const tx = invDet * (dirY * sx - dirX * sy);
    const ty = invDet * (-planeY * sx + planeX * sy);
    if (ty <= 0.4 || ty > 14) continue;                 // behind us, or too far to read

    const screenX = (VIEW_W / 2) * (1 + tx / ty);
    const col = Math.round(screenX);
    if (col < 0 || col >= VIEW_W || ty >= zBuffer[col]) continue;   // a wall is in front

    const height = Math.min(VIEW_H * 3, (VIEW_H / ty) * 0.82);
    const headY = VIEW_H / 2 + horizon + (VIEW_H / ty) * 0.09 - height;
    const size = Math.max(9, Math.min(16, (VIEW_H / ty) * 0.05));
    const mode = guardMode(e);

    ctx.font = 'bold ' + size.toFixed(0) + 'px system-ui, sans-serif';
    const w = ctx.measureText(mode.name).width;
    const y = Math.max(size + 10, headY - 6);

    ctx.globalAlpha = Math.max(0.35, Math.min(1, fog(ty) * 1.5));
    ctx.fillStyle = 'rgba(8,6,6,0.72)';
    ctx.fillRect(screenX - w / 2 - 5, y - size - 3, w + 10, size + 7);
    ctx.fillStyle = mode.colour;
    ctx.fillText(mode.name, screenX, y);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
}

// The closer the nearest guard, the harder the edges of the screen bleed.
// It is the one warning you get about something creeping up behind you.
function drawDanger() {
  let nearest = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < nearest) nearest = d;
  }
  if (nearest >= DANGER_RANGE) return 0;

  const closeness = 1 - nearest / DANGER_RANGE;
  const strength = closeness * closeness;          // stays subtle until they are near
  const grad = ctx.createRadialGradient(
    VIEW_W / 2, VIEW_H / 2, VIEW_H * 0.12,
    VIEW_W / 2, VIEW_H / 2, VIEW_W * 0.60);
  grad.addColorStop(0, 'rgba(190,24,34,0)');
  grad.addColorStop(0.55, 'rgba(190,24,34,' + (0.30 * strength).toFixed(3) + ')');
  grad.addColorStop(1, 'rgba(210,26,36,' + (0.80 * strength).toFixed(3) + ')');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  return strength;
}

function drawSprites() {
  // Furthest first, so nearer things paint over them
  const list = [];
  const active = keys3d[player.keys];
  if (active && !active.taken) list.push({ x: active.x, y: active.y, kind: 'key' });
  for (const e of enemies) list.push({ x: e.x, y: e.y, kind: 'enemy', alert: e.alert > 0, stunned: e.stun > 0 });
  list.sort((a, b) =>
    Math.hypot(b.x - player.x, b.y - player.y) - Math.hypot(a.x - player.x, a.y - player.y));

  for (const s of list) {
    if (s.kind === 'key') { drawSprite(s.x, s.y, 224, 192, 104, 0.28, 0.18); continue; }
    drawPerson(s.x, s.y, s.stunned ? [120, 120, 132] : tier().colour, s.alert && !s.stunned);
  }
}

function drawMinimap() {
  const scale = 3, pad = 10;
  const w = COLS * scale, h = ROWS * scale;
  const ox = VIEW_W - w - pad, oy = pad;

  ctx.globalAlpha = 0.85;
  ctx.fillStyle = '#0b0d11';
  ctx.fillRect(ox - 3, oy - 3, w + 6, h + 6);

  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (isDoor(c, r))      ctx.fillStyle = player.keys >= KEYS_NEEDED ? '#4caf50' : '#bd3c46';
    else if (isShrine(c, r)) ctx.fillStyle = '#6b4a52';
    else if (isPillar(c, r)) ctx.fillStyle = '#7a6e5c';
    else if (isRock(c, r))   ctx.fillStyle = '#332f2c';
    else if (isWall(c, r))   ctx.fillStyle = '#4a4239';
    else                   ctx.fillStyle = '#1c1815';
    ctx.fillRect(ox + c * scale, oy + r * scale, scale, scale);
  }

  // You, and the way you are looking
  ctx.fillStyle = '#8fd8ff';
  ctx.fillRect(ox + player.x * scale - 2, oy + player.y * scale - 2, 4, 4);
  ctx.strokeStyle = '#8fd8ff';
  ctx.beginPath();
  ctx.moveTo(ox + player.x * scale, oy + player.y * scale);
  ctx.lineTo(ox + (player.x + Math.cos(player.angle) * 2.2) * scale,
             oy + (player.y + Math.sin(player.angle) * 2.2) * scale);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// Which way is the thing you are looking for? Screen coordinates run
// with +y downward, so south is positive y.
function bearingTo(tx, ty) {
  const dx = tx - player.x, dy = ty - player.y;
  const names = ['east', 'south-east', 'south', 'south-west',
                 'west', 'north-west', 'north', 'north-east'];
  let a = Math.atan2(dy, dx);
  if (a < 0) a += Math.PI * 2;
  return names[Math.round(a / (Math.PI / 4)) % 8];
}

function drawObjective() {
  const done = player.keys >= KEYS_NEEDED;
  const target = done ? { x: doorCol + 0.5, y: doorRow + 0.5 } : keys3d[player.keys];
  const heading = bearingTo(target.x, target.y);
  const paces = Math.round(Math.hypot(target.x - player.x, target.y - player.y));

  const title = done ? 'ESCAPE' : 'OBJECTIVE ' + (player.keys + 1) + ' of ' + KEYS_NEEDED;
  const line  = done
    ? 'The Iron Door  -  ' + heading + ', ' + paces + ' paces'
    : KEYS[player.keys].name + ', in ' + KEYS[player.keys].place +
      '  -  ' + heading + ', ' + paces + ' paces';

  ctx.font = 'bold 11px system-ui, sans-serif';
  const w = Math.max(ctx.measureText(title).width, 0) + 24;
  ctx.font = '14px system-ui, sans-serif';
  const w2 = ctx.measureText(line).width + 24;

  ctx.globalAlpha = 0.82;
  ctx.fillStyle = '#0b0908';
  ctx.fillRect(12, 12, Math.max(w, w2), 46);
  ctx.globalAlpha = 1;

  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  ctx.fillStyle = done ? '#7ee081' : '#9a8f7d';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.fillText(title, 24, 20);
  ctx.fillStyle = '#e8dfd0';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText(line, 24, 36);
  ctx.textBaseline = 'middle';
}

function drawHUD() {
  const top = VIEW_H;
  ctx.fillStyle = '#0e1013';
  ctx.fillRect(0, top, VIEW_W, HUD_H);

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#8b93a7';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText('HEALTH', 14, top + HUD_H / 2);

  const bw = 38, bh = 15, gap = 5, sx = 82;
  for (let i = 0; i < MAX_HEALTH; i++) {
    ctx.fillStyle = i < player.health ? '#d1495b' : '#2a2f3a';
    ctx.fillRect(sx + i * (bw + gap), top + (HUD_H - bh) / 2, bw, bh);
  }

  ctx.fillStyle = '#8b93a7';
  ctx.fillText('KEYS', 268, top + HUD_H / 2);
  for (let i = 0; i < KEYS_NEEDED; i++) {
    ctx.fillStyle = i < player.keys ? '#e0c068' : '#2a2f3a';
    ctx.fillRect(310 + i * 22, top + (HUD_H - 15) / 2, 15, 15);
  }

  const t = tier();
  ctx.fillStyle = '#8b93a7';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText('THREAT', 392, top + HUD_H / 2);
  ctx.fillStyle = 'rgb(' + t.colour[0] + ',' + t.colour[1] + ',' + t.colour[2] + ')';
  ctx.fillText(t.label + (t.damage > 1 ? '  x' + t.damage : ''), 448, top + HUD_H / 2);

  ctx.textAlign = 'right';
  ctx.font = '11px system-ui, sans-serif';
  ctx.fillStyle = '#5c6478';
  ctx.fillText('W/S+A/D move   hold click to reposition', VIEW_W - 14, top + HUD_H / 2);
  ctx.textAlign = 'left';
}

function drawBanner(title, subtitle, colour) {
  ctx.fillStyle = 'rgba(10,12,16,0.84)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = colour;
  ctx.font = 'bold 44px system-ui, sans-serif';
  ctx.fillText(title, VIEW_W / 2, VIEW_H / 2 - 16);
  ctx.fillStyle = '#c8cede';
  ctx.font = '17px system-ui, sans-serif';
  ctx.fillText(subtitle, VIEW_W / 2, VIEW_H / 2 + 26);
  ctx.textAlign = 'left';
}

function draw() {
  // Ceiling and floor
  const skyline = Math.max(0, Math.min(VIEW_H, VIEW_H / 2 + horizon));
  ctx.fillStyle = '#0d0b0a';
  ctx.fillRect(0, 0, VIEW_W, skyline);
  ctx.fillStyle = '#1e1815';
  ctx.fillRect(0, skyline, VIEW_W, VIEW_H - skyline);

  castWalls();
  drawLamps();
  drawSprites();
  drawGuardLabels();
  drawDanger();

  // A red wash when you have just been hit
  if (player.invuln > 0) {
    ctx.fillStyle = 'rgba(209,73,91,' + (0.32 * (player.invuln / INVULN_TIME)).toFixed(3) + ')';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }

  if (gameState === 'playing' && !pointerInView) {
    ctx.textAlign = 'center';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(232, 223, 208, 0.5)';
    ctx.fillText('move the cursor over the view to steer   -   M toggles the map', VIEW_W / 2, VIEW_H - 16);
    ctx.textAlign = 'left';
  }
  drawObjective();
  if (showMap) drawMinimap();

  if (message) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.fillStyle = '#e6ebf5';
    ctx.fillText(message, VIEW_W / 2, VIEW_H - 34);
    ctx.textAlign = 'left';
  }

  drawHUD();

  if (gameState === 'won')  drawBanner('YOU ESCAPED', 'Press R to play again', '#7ee081');
  if (gameState === 'dead') drawBanner('YOU DIED',    'Press R to try again',  '#d1495b');
}

// ---------------------------------------------------------------
// The game loop
// ---------------------------------------------------------------
let lastTime = performance.now();
function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

buildPatrolFields();
resetGame();
requestAnimationFrame(frame);
</script>

</body>
</html>
